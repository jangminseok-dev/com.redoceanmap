# auth — backend와 같은 이미지·다른 엔트리포인트. JWT 개인키(.env.auth)는 이 파드에만 주입한다(발급 경계).
apiVersion: v1
kind: Service
metadata:
  name: auth
spec:
  selector:
    app: auth
  ports:
    - port: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: minseok97/redoceanmap-backend:dev
          imagePullPolicy: Never
          # 마이그레이션(alembic)은 backend 소유 — 여기서는 돌리지 않는다.
          command: ["uvicorn", "auth_main:app", "--host", "0.0.0.0", "--port", "9000", "--reload"]
          envFrom:
            - secretRef:
                name: redocean-env        # 공용(.env — JWT_PUBLIC_KEY_B64 포함)
            - secretRef:
                name: redocean-auth-env   # auth 전용(.env.auth — JWT_PRIVATE_KEY_B64)
          env:
            - name: ENV
              value: development
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@pgvector:5432/$(POSTGRES_DB)
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: REDIS_URL_MOBILE          # 모바일 세션 — 웹(db 0)과 논리 DB 분리
              value: redis://redis:6379/1
          ports:
            - containerPort: 9000
              hostPort: 19000
              hostIP: 127.0.0.1
          readinessProbe:
            httpGet:
              path: /health
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: src
              mountPath: /app
      volumes:
        - name: src
          hostPath:
            path: /home/host/projects/com.redoceanmap/minseok
            type: Directory
