# 공유 DB(개발용). 실운영 DB(구 스택 :5432)와는 완전히 별개의 빈 DB — alembic이 스키마를 만든다.
apiVersion: v1
kind: Service
metadata:
  name: pgvector
spec:
  clusterIP: None
  selector:
    app: pgvector
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pgvector
spec:
  serviceName: pgvector
  replicas: 1
  selector:
    matchLabels:
      app: pgvector
  template:
    metadata:
      labels:
        app: pgvector
    spec:
      containers:
        - name: pgvector
          image: pgvector/pgvector:pg16
          envFrom:
            - secretRef:
                name: redocean-env   # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
          ports:
            - containerPort: 5432
              hostPort: 15432        # 호스트 도구용(psql 등)
              hostIP: 127.0.0.1      # 루프백만 — 0.0.0.0 금지(LAN 노출 차단)
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi   # k3s local-path — /var/lib/rancher/k3s/storage 아래에 생긴다
