# backend가 N8N_EMAIL_WEBHOOK_URL=http://n8n:5678/... 로 호출한다(Service 이름 = n8n).
apiVersion: v1
kind: Service
metadata:
  name: n8n
spec:
  selector:
    app: n8n
  ports:
    - port: 5678
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: n8n
spec:
  serviceName: n8n
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:2.28.6   # 실운영과 같은 버전 고정
          env:
            - name: N8N_HOST
              value: localhost
            - name: N8N_PORT
              value: "5678"
            - name: WEBHOOK_URL
              value: http://localhost:15678/
          ports:
            - containerPort: 5678
              hostPort: 15678
              hostIP: 127.0.0.1
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
