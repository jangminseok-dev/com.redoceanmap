# backend — docker-compose.yaml의 backend와 같은 값. 코드는 hostPath로 마운트해 --reload 핫리로드 유지.
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1          # alembic upgrade head를 기동 시 돌리므로 1 고정(이중 실행 경합 방지)
  strategy:
    type: Recreate     # 같은 이유 — 구 파드가 내려간 뒤 새 파드가 뜬다
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # 호스트 서비스 접근(Ollama :11434, market DB :5434)은 도커 브리지 게이트웨이 IP로.
      # 도커 엔진을 완전히 걷어내는 2단계에서는 이 IP가 사라지므로 노드 IP(status.hostIP)로 바꾼다.
      hostAliases:
        - ip: 172.17.0.1
          hostnames: ["host.docker.internal"]
      containers:
        - name: backend
          image: minseok97/redoceanmap-backend:dev
          imagePullPolicy: Never   # k8s/dev/load-image.sh로 반입한 로컬 이미지만 쓴다(허브 pull 금지)
          command: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"]
          envFrom:
            - secretRef:
                name: redocean-env        # 루트 .env 전체
          env:
            - name: ENV
              value: development
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@pgvector:5432/$(POSTGRES_DB)
            - name: MARKET_DATABASE_URL          # prod compose와 동일 — market 전용 DB(:5434)로 직결
              value: $(MARKET_DATABASE_URL_DOCKER)
            - name: OLLAMA_HOST
              value: http://host.docker.internal:11434
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: N8N_EMAIL_WEBHOOK_URL
              value: http://n8n:5678/webhook/redocean-email
            - name: AWS_DEFAULT_REGION
              value: ap-northeast-2
            - name: VISION_S3_BUCKET
              value: redoceanmap.com-752767405178-ap-northeast-2-an
          ports:
            - containerPort: 8000
              hostPort: 18000          # 실운영(:8000)과 충돌하지 않게 1만 번대
              hostIP: 127.0.0.1
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15    # alembic + 앱 기동 여유
            periodSeconds: 10
          volumeMounts:
            - name: src
              mountPath: /app
      volumes:
        - name: src
          hostPath:
            path: /home/host/projects/com.redoceanmap/minseok
            type: Directory
