# 블로그 정적 서빙 — 구 스택(/home/host/projects/redoceanmap)의 blog-static(nginx:alpine)을 대체. 갱신은 blog/README.md의 rsync 절차.
apiVersion: v1
kind: Service
metadata:
  name: blog-static
spec:
  selector:
    app: blog-static
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-static
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-static
  template:
    metadata:
      labels:
        app: blog-static
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: site
          hostPath:
            path: /home/host/projects/redoceanmap/blog_site   # 기존 rsync 대상 그대로(옮기지 않는다)
            type: Directory
