# 인허가 업소 수집 — 주 1회(개업·폐업은 분기 팩트보다 느리게 변한다). 683 요청·약 10분. 리포 코드(hostPath) 실행(구 docker run -v).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: collect-business-permits
spec:
  schedule: "0 5 * * 2"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          hostAliases:
            - ip: 172.17.0.1
              hostnames: ["host.docker.internal"]
          containers:
            - name: job
              image: minseok97/redoceanmap-backend:latest
              imagePullPolicy: Never
              workingDir: /work/minseok
              command: ["python", "scripts/collect_business_permits.py"]
              envFrom:
                - secretRef:
                    name: redocean-env
                - configMapRef:
                    name: redocean-runtime
              env:
                - name: DATABASE_URL
                  value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@pgvector:5432/$(POSTGRES_DB)
                - name: MARKET_DATABASE_URL
                  value: $(MARKET_DATABASE_URL_DOCKER)
              volumeMounts:
                - name: repo
                  mountPath: /work
                  readOnly: true
          volumes:
            - name: repo
              hostPath:
                path: /home/host/projects/com.redoceanmap
                type: Directory
