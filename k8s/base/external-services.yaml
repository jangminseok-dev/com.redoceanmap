# 도커 compose에 남은 상태 계층으로 가는 길 — 셀렉터 없는 Service + EndpointSlice(도커 브리지 게이트웨이).
# Service 이름 = compose 서비스 이름이라 앱의 연결 문자열(@pgvector:5432 등)이 그대로 동작한다.
# ExternalName은 CNAME 방식이라 IP에 쓸 수 없다. Supabase 전환 시 이 파일만 교체한다.
apiVersion: v1
kind: Service
metadata:
  name: pgvector
spec:
  ports:
    - port: 5432
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pgvector-1
  labels:
    kubernetes.io/service-name: pgvector
addressType: IPv4
ports:
  - port: 5432
    protocol: TCP
endpoints:
  - addresses: ["172.17.0.1"]
    conditions:
      ready: true
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  ports:
    - port: 6379
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: redis-1
  labels:
    kubernetes.io/service-name: redis
addressType: IPv4
ports:
  - port: 6379
    protocol: TCP
endpoints:
  - addresses: ["172.17.0.1"]
    conditions:
      ready: true
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
spec:
  ports:
    - port: 7687
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: neo4j-1
  labels:
    kubernetes.io/service-name: neo4j
addressType: IPv4
ports:
  - port: 7687
    protocol: TCP
endpoints:
  - addresses: ["172.17.0.1"]
    conditions:
      ready: true
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
spec:
  ports:
    - port: 5678
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: n8n-1
  labels:
    kubernetes.io/service-name: n8n
addressType: IPv4
ports:
  - port: 5678
    protocol: TCP
endpoints:
  - addresses: ["172.17.0.1"]
    conditions:
      ready: true
