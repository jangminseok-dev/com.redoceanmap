# R-ONE 상가 임대료·공실률 — 분기 첫 달 10일(공표 지연 반영). 창업 재무 엔진 월세 원천.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: collect-rone-rent
spec:
  schedule: "0 5 10 1,4,7,10 *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          hostAliases:
            - ip: 172.17.0.1
              hostnames: ["host.docker.internal"]
          containers:
            - name: job
              image: minseok97/redoceanmap-backend:latest
              imagePullPolicy: Never
              workingDir: /app
              command: ["python", "scripts/collect_rone_rent.py"]
              envFrom:
                - secretRef:
                    name: redocean-env
                - configMapRef:
                    name: redocean-runtime
              env:
                - name: DATABASE_URL
                  value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@pgvector:5432/$(POSTGRES_DB)
                - name: MARKET_DATABASE_URL
                  value: $(MARKET_DATABASE_URL_DOCKER)
