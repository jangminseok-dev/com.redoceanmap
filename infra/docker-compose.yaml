# 앱(backend·auth)은 k3s로 갔다(k8s/). 이 파일은 DB 계층(상태)만 띄운다 — _docs/k3s-migration-2026-09.md
# 프로젝트 이름 고정 — 디렉토리명(infra)에서 유도되면 볼륨이 comredoceanmap_*에서 infra_*로 바뀌어 맥 데이터가 고아가 된다.
# 루트 .env 보간은 infra/.env(→ ../.env 심볼릭 링크)로 이어진다.
name: comredoceanmap

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "127.0.0.1:5678:5678"
      - "172.17.0.1:5678:5678"   # k3s 파드(backend → n8n 웹훅, cloudflared)용 — 도커 브리지 게이트웨이
    volumes:
      - n8n_data:/home/node/.n8n
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
      - "172.17.0.1:6379:6379"   # k3s 파드용
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  pgvector:
    image: pgvector/pgvector:pg16
    ports:
      # redoceanmap이 메인 — 정식 포트 5432 사용 (ragwatson pgvector는 5433으로 이동).
      - "127.0.0.1:5432:5432"
      - "172.17.0.1:5432:5432"   # k3s 파드용 — market compose와 같은 방식
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-redocean}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-redocean}
      - POSTGRES_DB=${POSTGRES_DB:-redoceanmap}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redocean -d redoceanmap"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 실운영 정의는 구 스택(/home/host/projects/redoceanmap/docker-compose.yaml)에 있다.
  # 두 파일이 갈라지면 머신마다 다른 설정으로 뜨므로 값을 동일하게 유지한다 — neo4j-strategy §2
  neo4j:
    image: neo4j:5.26                      # LTS 고정 — 부동 태그 금지
    profiles: ["graph"]                    # 선택 기동
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
      - "172.17.0.1:7687:7687"   # k3s 파드(bolt)용
    volumes:
      - neo4j_data:/data
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD 미설정}
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=512m
      - NEO4J_db_transaction_timeout=5s
    mem_limit: 1500m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  # DB 브라우저 — 공유 DB(:5432)와 market 전용 DB(:5434)를 한 화면에서 본다.
  # 2026-07-30까지 수동 `docker run`으로만 떠 있어 이 PC를 다시 세팅하면 사라지는 상태였다.
  # 두 DB는 서로 다른 compose에 있으므로 각 네트워크에 external로 붙는다(호스트 포트가 아니라
  # 컨테이너 이름으로 접속 — 그래서 servers.json의 Host가 redoceanmap-pgvector-1/market-pgvector다).
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin      # 기존 수동 컨테이너와 같은 이름 — 볼륨째 그대로 승계한다
    profiles: ["tools"]          # 선택 기동: docker compose --profile tools up -d pgadmin
    ports:
      - "127.0.0.1:5050:80"      # 루프백만 — 0.0.0.0 금지(LAN 노출 차단)
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:?PGADMIN_EMAIL 미설정}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:?PGADMIN_PASSWORD 미설정}
      # 신규 설치일 때만 서버 2개를 자동 등록한다(기존 볼륨에는 이미 등록돼 있어 무해).
      - PGADMIN_SERVER_JSON_FILE=/pgadmin4/servers.json
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ../_docs/pgadmin-servers.json:/pgadmin4/servers.json:ro
    networks:
      - default
      - redoceanmap_shared
      - market_app
    mem_limit: 512m
    restart: unless-stopped

networks:
  # 실행 중인 두 DB는 각각 다른 compose 소유라 external로 참조만 한다(여기서 만들지 않는다).
  redoceanmap_shared:
    external: true
    name: redoceanmap_default
  market_app:
    external: true
    name: market_default

volumes:
  n8n_data:
    name: n8n_data
  pgadmin_data:
    name: pgadmin_data          # 프로젝트 접두사 없이 기존 볼륨을 그대로 쓴다(등록된 서버 보존)
  redis_data:
  pgvector_data:
  neo4j_data:
