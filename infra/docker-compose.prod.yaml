# 2026-09 k3s 전환 — backend·auth·cloudflared는 k8s/overlays/prod로 갔다. 여기는 DB 계층 + uptime-kuma만.
# 프로덕션 compose (②-M2) — dev(docker-compose.yaml)와 분리된 독립 파일.
#
# dev와의 차이:
#   - --reload 제거, 소스 볼륨 마운트 제거(이미지에 구운 코드로만 실행 — 배포 = 재빌드)
#   - 전 서비스 restart: unless-stopped (재부팅 자동 복구, docker 서비스 enable 전제)
#   - backend·auth·cloudflared는 없다 — k3s(k8s/overlays/prod). 여기는 데이터 계층만
#   - neo4j·pgadmin 제외 (운영 도구는 dev 프로파일로 — 그래프 투영 cron은 dev compose의 neo4j를 쓴다)
#   - n8n 제외 (2026-08-20 실측 — 별도 프로젝트 /home/host/projects/n8n/ 에서 이미 돌고 있다.
#     여기 다시 선언하면 포트 5678과 볼륨 n8n_data를 두 프로젝트가 다툰다)
#   - name: redoceanmap 고정 (컨테이너 이름 유지 — cron의 docker exec가 이 이름을 쓴다)
#
# ⛔ --remove-orphans 를 붙이지 말 것. 같은 프로젝트 이름 아래 dev 프로파일로 띄운
#    redoceanmap-neo4j-1(그래프 투영 cron 02:15이 쓴다)이 orphan으로 잡혀 삭제된다.
#    기동 시 뜨는 orphan 경고는 정상이다.
#
# ⚠️ 전환 절차 (백엔드 PC — 구 스택 /home/host/projects/redoceanmap/ 에서 넘어올 때):
#   1. scripts/backup_db.sh 수동 1회 (안전망)
#   2. docker volume ls 로 실제 볼륨 이름 확인 → 아래 external name과 다르면 수정
#      (external 선언이라 이름이 틀리면 빈 DB로 조용히 뜨는 대신 기동이 실패한다 — 의도)
#   3. 구 스택 down (볼륨은 유지됨) → ./deploy.sh
#   4. 로그인→대화→지도 수동 스모크 + /health의 version.commit 확인
#   5. 되돌리려면: 이 파일로 down → 구 스택 /home/host/projects/redoceanmap/ 에서 up -d
#      (볼륨이 external이라 데이터는 어느 쪽으로 가든 그대로다)
#
# 배포(평시): ./deploy.sh (k3s 반입·apply). 이 파일은 DB 계층 변경 때만 up -d 한다.

# 프로젝트 이름 고정. 빼면 디렉토리명에서 `comredoceanmap`이 유도돼 컨테이너가
# `comredoceanmap-backend-1`이 된다 — cron의 `docker exec redoceanmap-backend-1`
# (그래프 투영·신선도 감시)과 문서의 psql 명령이 전부 깨진다.
name: redoceanmap

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
      - "172.17.0.1:6379:6379"   # k3s 파드용 — 도커 브리지 게이트웨이
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgvector:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5432:5432"   # DB 비노출 — 루프백만 (백업 cron이 localhost로 붙는다)
      - "172.17.0.1:5432:5432"   # k3s 파드용 — market compose와 같은 방식(LAN 비노출)
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-redocean}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-redocean}
      - POSTGRES_DB=${POSTGRES_DB:-redoceanmap}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redocean -d redoceanmap"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 운영 관측(③-M4) — 가동 감시 + 장애 알림. 데이터는 신규 볼륨(external 아님 — 첫 기동이 만든다).
  # 첫 접속(http://127.0.0.1:3001, ssh 포워딩 경유)에서 관리자 계정을 만들고 모니터를 등록한다:
  #   ① http://backend:8000/health  ② http://auth:9000/health  (컨테이너 네트워크 안 — 60초 주기)
  #   ③ https://api.redoceanmap.com/health  (터널 포함 공개 경로 검증)
  # 알림은 UI에서 설정 — 게이트 "강제 다운 시 5분 내"는 주기 60s × 재시도 3이면 여유 있게 든다.
  # 주의: 이 감시도 백엔드 PC 안에서 돈다 — PC 자체가 꺼지면 알림도 없다(.env.example 운영 알림
  # 절과 같은 한계). 호스트 다운까지 잡으려면 외부 무료 모니터(예: UptimeRobot)가 ③을 겸감시한다.
  uptime-kuma:
    image: louislam/uptime-kuma:1
    ports:
      - "127.0.0.1:3001:3001"   # 루프백 잠금 — 대시보드는 ssh 포워딩으로만 접근
    volumes:
      - uptime_kuma_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"   # 모니터 대상이 k3s 파드(hostPort 172.17.0.1)로 옮겨감
    restart: unless-stopped


volumes:
  # 업타임 모니터 설정·이력(③-M4) — 구 스택에 없던 신규 볼륨이라 external이 아니다
  uptime_kuma_data:
  # 아래는 전부 external — 구 스택의 데이터를 이어받는다. 이름이 실제와 다르면 기동이 실패한다
  # (빈 볼륨으로 조용히 뜨는 것보다 낫다). 백엔드 PC에서 docker volume ls로 확인 후 수정.
  redis_data:
    external: true
    name: redoceanmap_redis_data
  pgvector_data:
    external: true
    name: redoceanmap_pgvector_data
