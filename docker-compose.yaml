# 이 파일은 aws 브랜치 전용이다. EC2(2 vCPU / 7.6GB / GPU 없음)에는 가벼운 것만 올리고,
# 무거운 것(Postgres 실데이터, Ollama LLM)은 백엔드 PC에 두고 리버스 SSH 터널로 참조한다.
services:
  backend:
    build:
      context: ./minseok
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./minseok:/app
    env_file:
      - .env  # JWT_SECRET 등 비밀값 (environment가 같은 키보다 우선)
    # host.docker.internal → docker0(172.17.0.1). 백엔드 PC가 여기에 -R 터널을 묶는다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-redocean}:${POSTGRES_PASSWORD:-redocean}@host.docker.internal:5432/${POSTGRES_DB:-redoceanmap}
      - OLLAMA_HOST=http://host.docker.internal:11434
      - REDIS_URL=redis://redis:6379/0
      - AWS_DEFAULT_REGION=ap-northeast-2
      - VISION_S3_BUCKET=redoceanmap.com-752767405178-ap-northeast-2-an
    depends_on:
      redis:
        condition: service_started
    # alembic은 백엔드 PC가 소유한다. EC2는 같은 실 DB를 원격 참조할 뿐이므로
    # 여기서 migration을 돌리면 실 데이터에 스키마 변경이 가해진다 — 돌리지 않는다.
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

volumes:
  redis_data:
