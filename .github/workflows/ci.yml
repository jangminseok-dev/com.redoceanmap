name: CI

# 세 브랜치(mac·window·main)는 항상 같은 커밋이라 main 푸시 한 번만 검증한다
# (private 저장소 — 같은 커밋을 3번 돌리면 무료 분수만 3배로 쓴다).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minseok
    env:
      # core.config가 임포트 시점에 요구하는 값 — CI에서 실제 DB 접속은 없다(테스트는 스텁)
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"  # Dockerfile(python:3.11-slim)과 일치
          cache: pip
          cache-dependency-path: minseok/requirements.txt
      # 설치 순서는 Dockerfile과 같다 — CPU torch 선설치(CUDA 휠 차단) + opencv headless 교체
      - name: Install dependencies
        run: |
          pip install torch==2.12.1+cpu torchvision==0.27.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip uninstall -y opencv-python && pip install opencv-python-headless==5.0.0.93
      # 발급→검증 왕복 테스트용 일회용 키쌍 — 실제 키(.env·.env.auth)는 CI에 두지 않는다
      - name: JWT keys (ephemeral)
        run: |
          openssl genrsa -out "$RUNNER_TEMP/jwt_private.pem" 2048
          openssl rsa -in "$RUNNER_TEMP/jwt_private.pem" -pubout -out "$RUNNER_TEMP/jwt_public.pem"
          echo "JWT_PRIVATE_KEY_B64=$(base64 -w0 "$RUNNER_TEMP/jwt_private.pem")" >> "$GITHUB_ENV"
          echo "JWT_PUBLIC_KEY_B64=$(base64 -w0 "$RUNNER_TEMP/jwt_public.pem")" >> "$GITHUB_ENV"
      - name: Architecture harness (import-linter)
        run: PYTHONPATH=apps lint-imports --config .importlinter
      - name: Tests
        run: PYTHONPATH=.:apps pytest apps tests -q -p no:cacheprovider -m "not network and not ollama"
